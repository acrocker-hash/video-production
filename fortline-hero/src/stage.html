<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #282828; }
  #stage { position: relative; overflow: hidden; background: #282828; }
  .panel { position: absolute; overflow: hidden; background: #282828; }
  .lay { position: absolute; inset: 0; overflow: hidden; }
  .lay img { position: absolute; left: 0; top: 0; transform-origin: 0 0;
             filter: grayscale(1) contrast(1.12) brightness(.97); }
  .white { position: absolute; inset: 0; background: #fff; }
  .edge { position: absolute; top: 0; bottom: 0; width: 0; background: #FE5A00; }
  .foot { position: absolute; background: #fff; transform-origin: 0 0; border-radius: 0 0 100% 0; }
  .foot.v { background: #FE5A00; }
  #dim { position: absolute; inset: 0; background: #282828; opacity: 0; }
  #lockup { position: absolute; overflow: visible; }
  #lockup .bar { transform-box: fill-box; transform-origin: 100% 50%; }
  #lockup .ft  { transform-box: fill-box; transform-origin: 0 0; }
</style>
</head>
<body>
<div id="stage">
  <!-- bands (born from the logo bars) -->
  <div class="panel" id="b1"><div class="lay" id="b1a"><img></div><div class="lay" id="b1b"><img></div><div class="edge" id="b1e"></div><div class="white" id="b1w"></div></div>
  <div class="panel" id="b2"><div class="lay" id="b2a"><img></div><div class="lay" id="b2b"><img></div><div class="edge" id="b2e"></div><div class="white" id="b2w"></div></div>
  <div class="foot" id="f1"></div>
  <div class="foot v" id="f2"></div>
  <!-- columns -->
  <div class="panel" id="c1"><div class="lay"><img></div></div>
  <div class="panel" id="c3"><div class="lay"><img></div></div>
  <div class="panel" id="c2"><div class="lay"><img></div></div>
  <div id="dim"></div>
  <!-- end lockup -->
  <svg id="lockup" viewBox="0 0 2870 671" fill="#FFFFFF">
    <defs><clipPath id="wmclip"><rect id="wmrect" x="874" y="-20" width="0" height="711"/></clipPath></defs>
    <g id="icon">
      <path class="bar" id="L-bar-1" d="M200,200 A200,200 0 0 1 400,0 L776,0 L776,200 Z"/>
      <path class="ft"  id="L-foot-1" d="M0,200 L200,200 A200,200 0 0 1 0,400 Z"/>
      <path class="bar" id="L-bar-2" d="M200,471 A200,200 0 0 1 400,271 L776,271 L776,471 Z"/>
      <path class="ft"  id="L-foot-2" fill="#FE5A00" d="M0,471 L200,471 A200,200 0 0 1 0,671 Z"/>
    </g>
    <g clip-path="url(#wmclip)"><g id="wmslide">__WORDMARK__</g></g>
  </svg>
</div>
<script>
const W = __W__, H = __H__, FPS = 30;
const IMG = __IMG__;   // {b1a,b1b,b2a,b2b,c1,c2,c3}: src
const $ = id => document.getElementById(id);
const stage = $('stage'); stage.style.width = W + 'px'; stage.style.height = H + 'px';

// ---- easing (brand: --fpa-ease-in-out .65,0,.35,1 ; --fpa-ease .2,.7,.1,1) ----
function bezier(x1, y1, x2, y2) {
  return t => { if (t <= 0) return 0; if (t >= 1) return 1;
    let lo = 0, hi = 1, u = t;
    for (let i = 0; i < 40; i++) { u = (lo + hi) / 2;
      const x = 3*(1-u)*(1-u)*u*x1 + 3*(1-u)*u*u*x2 + u*u*u;
      if (x < t) lo = u; else hi = u; }
    return 3*(1-u)*(1-u)*u*y1 + 3*(1-u)*u*u*y2 + u*u*u; };
}
const EIO = bezier(.65, 0, .35, 1), EOUT = bezier(.2, .7, .1, 1), EIN = bezier(.55, 0, .9, .4);
const clamp = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const lr = (A, B, p) => ({x: lerp(A.x,B.x,p), y: lerp(A.y,B.y,p), w: lerp(A.w,B.w,p), h: lerp(A.h,B.h,p), r: lerp(A.r,B.r,p)});

// ---- layout ----
const portrait = H > W;
const g = Math.round(Math.min(W, H) * 0.012);           // carbon gutter
const R = Math.round(Math.min(W, H) * 0.11);            // brand corner (fpa-corner-l)
const iconW = Math.min(W, H) * (portrait ? 0.34 : 0.26); // intro mark width (776 units)
const s = iconW / 776, iconX = (W - iconW) / 2, iconY = (H - 671 * s) / 2;
const barRect = (y0) => ({x: iconX + 200*s, y: iconY + y0*s, w: 576*s, h: 200*s, r: 200*s});
const BAR1 = barRect(0), BAR2 = barRect(271);
const bh = (H - 3*g) / 2;
const BAND1 = {x: g, y: g, w: W - 2*g, h: bh, r: R};
const BAND2 = {x: g, y: 2*g + bh, w: W - 2*g, h: bh, r: R};
const cw = (W - 4*g) / 3;
const COL = i => ({x: g + i*(cw + g), y: g, w: cw, h: H - 2*g, r: R * 0.8});
const FULL = {x: g, y: g, w: W - 2*g, h: H - 2*g, r: R};
const lockW = Math.min(W * (portrait ? 0.74 : 0.5), 1100);
const lockH = lockW * 671 / 2870;
const lk = $('lockup'); Object.assign(lk.style, {left: (W - lockW)/2 + 'px', top: (H - lockH)/2 + 'px', width: lockW + 'px', height: lockH + 'px'});

function box(el, b) { Object.assign(el.style, {left: b.x+'px', top: b.y+'px', width: Math.max(0,b.w)+'px', height: Math.max(0,b.h)+'px', borderTopLeftRadius: Math.min(b.r, b.h, b.w)+'px'}); }
// cover-fit an image in a w x h box; zoom >= 1, pan px/py in [-1,1]
function cover(img, w, h, zoom, px, py) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sc = Math.max(w/iw, h/ih) * zoom, dw = iw*sc, dh = ih*sc;
  const ox = (w - dw)/2 + px*(dw - w)/2, oy = (h - dh)/2 + py*(dh - h)/2;
  img.style.width = dw + 'px'; img.style.height = dh + 'px';
  img.style.transform = `translate(${ox}px,${oy}px)`;
}

// assign sources
for (const [k, src] of Object.entries(IMG)) {
  const host = $(k); (host.tagName === 'IMG' ? host : host.querySelector('img')).src = src;
}
window.ready = () => Promise.all([...document.images].map(i => i.decode()));

window.render = function (t) {
  // ---------- A+B: mark assembles, bars open into bands ----------
  const morph = EIO(prog(t, 1.5, 2.55));
  const grow1 = EIO(prog(t, 0.15, 0.77)), grow2 = EIO(prog(t, 0.35, 0.97));
  const bandsOn = t < 6.2;
  for (const [id, BAR, BAND, gr, dir] of [['b1', BAR1, BAND1, grow1, 1], ['b2', BAR2, BAND2, grow2, -1]]) {
    const el = $(id); el.style.display = bandsOn ? 'block' : 'none'; if (!bandsOn) continue;
    // bar grows leftward from its right edge (as the site preloader)
    const bar = {...BAR, w: BAR.w * gr, x: BAR.x + BAR.w * (1 - gr)};
    const b = lr(bar, BAND, morph); box(el, b);
    $(id + 'w').style.opacity = 1 - EIO(prog(t, 1.85, 2.6));
    // horizontal drift, opposite directions per band
    const zoom = 1.22 - 0.06 * morph;
    const pan = dir * lerp(0.9, -0.9, prog(t, 1.5, 6.2));
    cover($(id + 'a').querySelector('img'), b.w, b.h, zoom, pan, 0);
    cover($(id + 'b').querySelector('img'), b.w, b.h, zoom, pan * 0.6, 0);
    // swap wipe: top band from the right, bottom band from the left, vermilion leading edge
    const sw = EIO(prog(t, id === 'b1' ? 3.55 : 3.7, id === 'b1' ? 4.35 : 4.5));
    const lb = $(id + 'b'), e = $(id + 'e');
    if (dir > 0) { lb.style.clipPath = `inset(0 0 0 ${(1 - sw) * 100}%)`; e.style.left = (b.w * (1 - sw) - 7) + 'px'; }
    else         { lb.style.clipPath = `inset(0 ${(1 - sw) * 100}% 0 0)`; e.style.left = (b.w * sw) + 'px'; }
    e.style.width = (sw > 0.001 && sw < 0.999) ? '7px' : '0';
  }
  // feet: scale in with the mark, scale out as the bars open
  const f1 = EOUT(prog(t, 0.6, 1.02)) * (1 - EIN(prog(t, 1.4, 1.75)));
  const f2 = EOUT(prog(t, 0.77, 1.19)) * (1 - EIN(prog(t, 1.48, 1.83)));
  for (const [id, y0, k] of [['f1', 200, f1], ['f2', 471, f2]]) {
    const el = $(id); el.style.display = k > 0 ? 'block' : 'none';
    Object.assign(el.style, {left: iconX + 'px', top: (iconY + y0*s) + 'px', width: 200*s + 'px', height: 200*s + 'px', transform: `scale(${k})`});
  }

  // ---------- D/E/F: column shutters, then the middle opens to full frame ----------
  const open = EIO(prog(t, 7.45, 8.45));
  for (const [id, i, st, dir] of [['c1', 0, 4.95, 1], ['c2', 1, 5.07, -1], ['c3', 2, 5.19, 1]]) {
    const el = $(id), up = EIO(prog(t, st, st + 0.85));
    el.style.display = up > 0 ? 'block' : 'none'; if (up <= 0) continue;
    const C = COL(i);
    let b = {...C, h: C.h * up, y: C.y + C.h * (1 - up)};       // rises from the bottom
    if (i === 1) b = lr(b, FULL, open);
    else if (i === 0) b = {...b, w: b.w * (1 - open), x: b.x - (cw + g) * 0.35 * open};
    else b = {...b, w: b.w * (1 - open), x: b.x + b.w * open + (cw + g) * 0.35 * open};
    if (b.w < 1) { el.style.display = 'none'; continue; }
    box(el, b);
    const img = el.querySelector('img');
    if (i === 1) {
      const z = lerp(1.25, 1.06, open) + 0.07 * prog(t, 8.45, 12.5);
      cover(img, b.w, b.h, z, 0, lerp(-0.5, 0, open) + 0.3 * prog(t, 8.45, 12.5));
    } else {
      cover(img, Math.max(b.w, cw), b.h, 1.2, 0, dir * lerp(-0.9, 0.9, prog(t, 4.95, 8.45)));
    }
  }

  // ---------- G/H: dim, lockup assembles, wordmark wipes on; then out to carbon ----------
  const dim = 0.6 * EIO(prog(t, 9.3, 10.1)) + 0.4 * EIO(prog(t, 11.75, 12.45));
  $('dim').style.opacity = dim;
  const L0 = 9.55;
  const lb1 = EIO(prog(t, L0 + .1, L0 + .72)), lb2 = EIO(prog(t, L0 + .3, L0 + .92));
  const lf1 = EOUT(prog(t, L0 + .55, L0 + .97)), lf2 = EOUT(prog(t, L0 + .72, L0 + 1.14));
  $('L-bar-1').style.transform = `scaleX(${lb1})`; $('L-bar-2').style.transform = `scaleX(${lb2})`;
  $('L-foot-1').style.transform = `scale(${lf1})`; $('L-foot-2').style.transform = `scale(${lf2})`;
  const wm = EIO(prog(t, L0 + .75, L0 + 1.6));
  $('wmrect').setAttribute('width', 2000 * wm);
  $('wmslide').setAttribute('transform', `translate(${-90 * (1 - wm)},0)`);
  lk.style.opacity = 1 - EIO(prog(t, 11.8, 12.4));
  lk.style.display = t > L0 ? 'block' : 'none';
};
</script>
</body>
</html>
